name: Local MCP
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      HELIX_MCP_HOME: ${{ github.workspace }}/.helix/mcp-ci
      HELIX_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test mcp/check.test.mjs
      - run: node mcp/cli.mjs setup --allow-local-code
      - run: node mcp/cli.mjs doctor
      - run: node mcp/runtime_check.mjs
